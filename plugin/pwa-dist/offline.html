<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Medusify</title>
    <style>
      :root { --bg: #F2F3F5; --label: #15191D; --label-2: #55606A; --tint: #1D4ED8; --tint-ink: #FFFFFF; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0A0C0E; --label: #F3F5F6; --label-2: #A3ADB5; --tint: #60A5FA; --tint-ink: #0B1A33; } }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100dvh; display: grid; place-items: center; padding: 24px max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: var(--bg); color: var(--label); font: 17px/1.3 -apple-system, system-ui, sans-serif; text-align: center; }
      main { max-width: 22rem; }
      svg { width: 40px; height: 40px; fill: var(--label-2); }
      h1 { margin-top: 12px; font-size: 1.18rem; }
      p { margin-top: 8px; color: var(--label-2); font-size: 0.88rem; }
      button { margin-top: 24px; min-height: 50px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--tint); color: var(--tint-ink); font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M213.92 210.62a8 8 0 1 1-11.84 10.76l-32.3-35.54a68.4 68.4 0 0 1-83.4-6.2 8 8 0 0 1 10.64-11.94 52 52 0 0 0 64 .89l-25.3-27.84A84 84 0 0 0 54.5 128a8 8 0 1 1-10.74-11.86 100.36 100.36 0 0 1 49.82-24.1L66.35 61.6a107.8 107.8 0 0 0-41.74 24.25 8 8 0 0 1-10.9-11.7 124 124 0 0 1 41.4-25.6L42.08 45.38a8 8 0 1 1 11.84-10.76ZM128 192a12 12 0 1 0 12 12 12 12 0 0 0-12-12Zm88-60a8 8 0 0 0 5.37-13.92 100.5 100.5 0 0 0-61.93-26.19 8 8 0 0 0-1.1 15.97 84.4 84.4 0 0 1 51.36 21.78A8 8 0 0 0 216 132Zm24-47.7A124 124 0 0 0 134.74 52.5a8 8 0 1 0-1.48 15.94 108 108 0 0 1 91.1 32.78A8 8 0 1 0 240 84.3Z"/></svg>
      <h1 id="t">Keine Verbindung</h1>
      <p id="p">Mit dem Internet verbinden und erneut versuchen.</p>
      <button id="b" type="button">Erneut versuchen</button>
    </main>
    <script src="/medusify/offline.js"></script>
  </body>
</html>
